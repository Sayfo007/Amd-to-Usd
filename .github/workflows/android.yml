name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Create Android project
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/admob@7
          npx cap init "Currency Exchange" com.sayfodroid.currency --web-dir www
          npx cap add android
          npx cap sync android
      - name: Add AdMob App ID to manifest
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          # Falls back to Google's public TEST app ID until you add the ADMOB_APP_ID secret
          APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          M=android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APP_ID\"/>\n    </application>#" $M
          grep -n "APPLICATION_ID" $M
          grep -i "admob" android/capacitor.settings.gradle android/app/capacitor.build.gradle || echo "WARNING: admob plugin not in gradle files"
      - name: Set app icon
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icon-192.png $R/mipmap-$d/$n.png
            done
          done
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
          else
            KS_PASS=android; KS_ALIAS=sayfodroid
            keytool -genkeypair -keystore release.keystore -storepass $KS_PASS \
              -alias $KS_ALIAS -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SAYFODROID"
          fi
          $BT/zipalign -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-pass pass:$KS_PASS \
            --ks-key-alias $KS_ALIAS --out CurrencyExchange.apk aligned.apk
          $BT/apksigner verify CurrencyExchange.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Currency Exchange v1.0.${{ github.run_number }}
          files: CurrencyExchange.apk
