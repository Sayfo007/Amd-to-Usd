<title>Currency Converter</title>
<style>
:root{--bg1:#0b1020;--bg2:#1b1450;--card:rgba(255,255,255,.08);--ink:#f3f5ff;--mute:#9aa4d1;--line:rgba(255,255,255,.14);--f:rgba(255,255,255,.07);--a1:#7c5cff;--a2:#22d3ee}
@media (prefers-color-scheme:light){:root{--bg1:#eef1ff;--bg2:#dff6ff;--card:rgba(255,255,255,.75);--ink:#141a3a;--mute:#5a6491;--line:rgba(20,26,58,.12);--f:rgba(20,26,58,.05)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:28px 16px;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 500px at 85% -10%,rgba(124,92,255,.35),transparent),radial-gradient(700px 500px at -10% 110%,rgba(34,211,238,.28),transparent),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
main{width:100%;max-width:480px}
h1{font-size:1.7rem;font-weight:750;margin:6px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:.92rem;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
label{display:block;font-size:.78rem;font-weight:600;color:var(--mute);margin:0 0 6px 4px}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--f);font-size:1rem;appearance:none}
select option{color:#111}
#amt{font-size:1.6rem;font-weight:700;margin-bottom:16px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
.row{display:flex;gap:10px;align-items:flex-end}
.row>div{flex:1;min-width:0}
.swap{flex:none;width:48px;height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-size:1.2rem;cursor:pointer;transition:transform .25s}
.swap:active{transform:rotate(180deg)}
.result{margin-top:20px;padding:20px;border-radius:18px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.result small{display:block;opacity:.88;font-size:.85rem}
.result b{display:block;font-size:2.1rem;margin:6px 0;word-break:break-all;line-height:1.1;letter-spacing:-.02em}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:.8rem;color:var(--mute)}
.link{background:none;border:0;color:var(--a2);cursor:pointer;padding:0;font:inherit;font-weight:600}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9;background:linear-gradient(160deg,var(--bg1),var(--bg2))}
#boot[hidden]{display:none}
#boot .card{width:100%;max-width:420px}
#boot h2{margin:0 0 4px;font-size:1.4rem}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.langs button,.more{padding:15px 10px;border:1px solid var(--line);border-radius:14px;background:var(--f);cursor:pointer;font-size:1.05rem}
.langs button:hover,.more:hover{border-color:var(--a2)}
.more{width:100%;margin-top:10px;color:var(--a2);font-weight:600}
#extra{display:none}
#splash{position:fixed;inset:0;z-index:30;background:#131a2c;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(78vw,380px);height:auto;border-radius:24px}
.amtw{position:relative;margin-bottom:16px}
.amtw #amt{margin-bottom:0;padding-inline-end:52px}
#clr{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:var(--line);color:var(--ink);cursor:pointer;font-size:.9rem}
#clr[hidden]{display:none}
.back{border:1px solid var(--line);background:var(--f);border-radius:12px;width:44px;height:44px;font-size:1.2rem;cursor:pointer;margin-bottom:12px}
[dir=rtl] .back{transform:scaleX(-1)}
.cbtn{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--f);font-size:.95rem;cursor:pointer;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pick{position:fixed;inset:0;z-index:8;padding:20px;background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:auto}
#pick[hidden]{display:none}
#pick .in{max-width:480px;margin:0 auto}
#plist{margin-top:12px;display:grid;gap:6px}
#plist button{padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--f);text-align:start;cursor:pointer;font-size:.95rem}
#plist button.sel{border-color:var(--a2)}
#extra.open{display:grid}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
</style>

<div id="adlog" hidden style="margin-top:12px;background:rgba(0,0,0,.45);color:#7CFC00;font:12px monospace;padding:8px 10px;border-radius:10px;white-space:pre-wrap"></div>
</main>

<script>
const I18N={
 hy:{n:"Հայերեն",title:"Արժույթի փոխարկիչ",sub:"by SAYFODROID",amt:"Գումար",from:"Ից",to:"Ին",live:"Կենդանի փոխարժեքներ",off:"Օֆլայն փոխարժեքներ (մոտավոր)",upd:"Թարմացվել է",lang:"Փոխել լեզուն",more:"Այլ լեզուներ ▾"},
 ru:{n:"Русский",title:"Конвертер валют",sub:"by SAYFODROID",amt:"Сумма",from:"Из",to:"В",live:"Актуальные курсы",off:"Офлайн-курсы (примерно)",upd:"Обновлено",lang:"Сменить язык",more:"Другие языки ▾"},
 en:{n:"English",title:"Currency Converter",sub:"by SAYFODROID",amt:"Amount",from:"From",to:"To",live:"Live rates",off:"Offline rates (approximate)",upd:"Updated",lang:"Change language",more:"More languages ▾"},
 ar:{n:"العربية",title:"محوّل العملات",sub:"by SAYFODROID",amt:"المبلغ",from:"من",to:"إلى",live:"أسعار مباشرة",off:"أسعار غير متصلة (تقريبية)",upd:"آخر تحديث",lang:"تغيير اللغة",more:"المزيد من اللغات ▾"},
 es:{n:"Español",title:"Conversor de divisas",sub:"by SAYFODROID",amt:"Cantidad",from:"De",to:"A",live:"Tasas en vivo",off:"Tasas sin conexión (aprox.)",upd:"Actualizado",lang:"Cambiar idioma"},
 fr:{n:"Français",title:"Convertisseur de devises",sub:"by SAYFODROID",amt:"Montant",from:"De",to:"Vers",live:"Taux en direct",off:"Taux hors ligne (approx.)",upd:"Mis à jour",lang:"Changer de langue"},
 de:{n:"Deutsch",title:"Währungsrechner",sub:"by SAYFODROID",amt:"Betrag",from:"Von",to:"Nach",live:"Live-Kurse",off:"Offline-Kurse (ungefähr)",upd:"Aktualisiert",lang:"Sprache ändern"},
 pt:{n:"Português",title:"Conversor de moedas",sub:"by SAYFODROID",amt:"Valor",from:"De",to:"Para",live:"Taxas ao vivo",off:"Taxas offline (aprox.)",upd:"Atualizado",lang:"Mudar idioma"},
 tr:{n:"Türkçe",title:"Döviz Çevirici",sub:"by SAYFODROID",amt:"Miktar",from:"Kaynak",to:"Hedef",live:"Canlı kurlar",off:"Çevrimdışı kurlar (yaklaşık)",upd:"Güncellendi",lang:"Dili değiştir"},
 fa:{n:"فارسی",title:"مبدل ارز",sub:"by SAYFODROID",amt:"مبلغ",from:"از",to:"به",live:"نرخ‌های زنده",off:"نرخ‌های آفلاین (تقریبی)",upd:"به‌روزرسانی",lang:"تغییر زبان"},
 zh:{n:"中文",title:"货币转换器",sub:"by SAYFODROID",amt:"金额",from:"从",to:"到",live:"实时汇率",off:"离线汇率（近似）",upd:"更新于",lang:"更改语言"},
 hi:{n:"हिन्दी",title:"मुद्रा परिवर्तक",sub:"by SAYFODROID",amt:"राशि",from:"से",to:"में",live:"लाइव दरें",off:"ऑफ़लाइन दरें (अनुमानित)",upd:"अपडेट",lang:"भाषा बदलें"}
};
const MAIN=["hy","ru","en","ar"],RTL=["ar","fa"];
// Offline fallback only: approximate units per 1 USD. Live rates replace this on startup.
let rates={USD:1,AMD:385,EUR:.92,GBP:.78,JPY:150,CNY:7.2,INR:83.5,CAD:1.37,AUD:1.53,CHF:.88,MXN:18,BRL:5.2,KRW:1350,RUB:92,TRY:34,ZAR:18.5,SEK:10.6,NOK:10.8,DKK:6.9,PLN:4,AED:3.673,SAR:3.75,EGP:48,NGN:1500,IDR:15800,THB:36,SGD:1.34,HKD:7.8,NZD:1.65,ILS:3.7,ARS:900,CLP:950,COP:4000,PKR:278,BDT:117,VND:25000,PHP:57,MYR:4.7,CZK:23,HUF:360,UAH:41,KES:129,MAD:10,GEL:2.7,AZN:1.7,KZT:480,IRR:42000};
let live=false,stamp="",lang="en",dn=null;
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

function curName(c){try{return dn.of(c)||c}catch(e){return c}}
function fill(first){
  const codes=Object.keys(rates).sort();
  const kf=first?"USD":$("from").value,kt=first?"AMD":$("to").value;
  for(const id of ["from","to"])$(id).innerHTML=codes.map(c=>`<option value="${c}">${c} – ${curName(c)}</option>`).join("");
  $("from").value=rates[kf]?kf:"USD";$("to").value=rates[kt]?kt:"AMD";
}
function fmt(n,c){try{return new Intl.NumberFormat(lang,{style:"currency",currency:c,maximumFractionDigits:n<1?6:2}).format(n)}catch(e){return n.toFixed(2)+" "+c}}
function btns(){for(const k of["from","to"]){const c=$(k).value;$(k+"Btn").textContent=c+" – "+curName(c)}}
function calc(){btns();{const v=$("amt").value;$("clr").hidden=(v===""||v==="0")}
  const a=parseFloat($("amt").value)||0,f=$("from").value,t=$("to").value,r=rates[t]/rates[f];
  $("line1").textContent=fmt(a,f)+" =";
  $("out").textContent=fmt(a*r,t);
  $("line2").textContent="1 "+f+" = "+r.toPrecision(6)+" "+t;
}
function apply(first){
  const s=I18N[lang],e=I18N.en;
  document.documentElement.lang=lang;
  document.documentElement.dir=RTL.includes(lang)?"rtl":"ltr";
  $("t_title").textContent=s.title;$("t_sub").textContent=s.sub;
  $("t_amt").textContent=s.amt;$("t_from").textContent=s.from;$("t_to").textContent=s.to;
  $("chlang").textContent="🌐 "+s.lang;
  $("status").textContent=live?s.live+" · "+s.upd+" "+stamp:s.off;
  try{dn=new Intl.DisplayNames([lang],{type:"currency"})}catch(x){dn=null}
  fill(first);calc();
}
function setLang(l){lang=l;store.set("cc_lang",l);$("boot").hidden=true;apply(false)}
const btn=k=>`<button data-l="${k}">${I18N[k].n}</button>`;
$("langs").innerHTML=MAIN.map(btn).join("");
$("extra").innerHTML=Object.keys(I18N).filter(k=>!MAIN.includes(k)).map(btn).join("");
$("boot").onclick=e=>{const l=e.target.dataset.l;if(l)setLang(l)};
$("more").onclick=()=>{const o=$("extra").classList.toggle("open");$("more").textContent=o?"▴":"More languages ▾"};
$("chlang").onclick=()=>{$("bootback").hidden=false;$("boot").hidden=false};
$("swap").onclick=()=>{const f=$("from").value;$("from").value=$("to").value;$("to").value=f;calc()};
["amt","from","to"].forEach(i=>$(i).addEventListener("input",calc));
$("clr").onclick=()=>{$("amt").value="";calc();$("amt").focus()};
$("amt").addEventListener("focus",()=>{$("amt").value="";calc()});
$("amt").addEventListener("blur",()=>{if($("amt").value==="")$("amt").value="0";calc()});
$("bootback").onclick=()=>{$("boot").hidden=true};
let pickFor="from";
function renderPick(){
  const q=$("psearch").value.trim().toLowerCase(),cur=$(pickFor).value;
  $("plist").innerHTML=Object.keys(rates).sort().filter(c=>!q||c.toLowerCase().includes(q)||curName(c).toLowerCase().includes(q))
    .map(c=>`<button data-c="${c}" class="${c===cur?"sel":""}">${c} – ${curName(c)}</button>`).join("");
}
function openPick(k){pickFor=k;$("psearch").value="";renderPick();$("pick").hidden=false}
$("fromBtn").onclick=()=>openPick("from");
$("toBtn").onclick=()=>openPick("to");
$("pickback").onclick=()=>{$("pick").hidden=true};
$("psearch").addEventListener("input",renderPick);
$("plist").onclick=e=>{const c=e.target.dataset.c;if(c){$(pickFor).value=c;$("pick").hidden=true;calc()}};

const saved=store.get("cc_lang");
if(I18N[saved])lang=saved;else $("boot").hidden=false;
apply(true);

// Live rates on startup (replaces offline values for every currency)
fetch("https://open.er-api.com/v6/latest/USD").then(r=>r.json()).then(d=>{
  if(d&&d.rates){rates=d.rates;live=true;stamp=new Date(d.time_last_update_utc).toLocaleDateString(lang);apply(false)}
}).catch(()=>{});
setTimeout(()=>{const sp=$("splash");sp.classList.add("out");setTimeout(()=>sp.remove(),600)},2000);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
// ---- AdMob banner (Android app only) ----
(function(){
  const TEST_ADS=false; // true = Google test ads + on-screen debug log
  const AD_UNIT="ca-app-pub-8500833036916424/4920742389";
  // Debug log box (only while TEST_ADS is true)
  const log=m=>{if(!TEST_ADS)return;try{
    const box=document.getElementById("adlog");if(!box)return;
    box.hidden=false;box.textContent+=m+"\n"}catch(e){}};
  const timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("timeout "+ms+"ms")),ms))]);
  const native=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
  log("ads: native="+native+" platform="+(window.Capacitor&&Capacitor.getPlatform?Capacitor.getPlatform():"none"));
  if(!native)return;
  (async()=>{
    try{
      const AdMob=(Capacitor.Plugins&&Capacitor.Plugins.AdMob)||(typeof Capacitor.registerPlugin==="function"?Capacitor.registerPlugin("AdMob"):null);
      log("ads: plugin found="+!!AdMob+" registered="+Object.keys(Capacitor.Plugins||{}).join(","));
      if(!AdMob)throw new Error("AdMob plugin not found in this build");
      ["bannerAdLoaded","bannerAdFailedToLoad","bannerAdSizeChanged"].forEach(n=>{
        try{AdMob.addListener(n,e=>log("event "+n+" "+JSON.stringify(e||{})))}catch(e){}});
      await timeout(AdMob.initialize({initializeForTesting:TEST_ADS}),8000);
      log("ads: initialized");
      try{
        const c=await timeout(AdMob.requestConsentInfo(),5000);
        log("ads: consent "+c.status);
        if(c.isConsentFormAvailable&&c.status==="REQUIRED")await AdMob.showConsentForm();
      }catch(e){log("ads: consent skipped ("+(e.message||e)+")")}
      await AdMob.showBanner({adId:AD_UNIT,adSize:"ADAPTIVE_BANNER",position:"BOTTOM_CENTER",margin:0,isTesting:TEST_ADS});
      log("ads: showBanner called");
    }catch(e){log("ads ERROR: "+(e&&e.message||JSON.stringify(e)))}
  })();
})();
</script>
</body>
